openapi: "3.0.3"
info:
  title: Currency quiz API
  description: >-
    Play a currency quiz without an account. An authenticated admin can manage questions.
  version: "2.0.0"
servers:
  - url: /
security: []
tags:
  - name: Quiz
    description: Questions and server-side answer checking.
  - name: Authentication
    description: Stateless JWT authentication for browser and non-browser clients.
  - name: Administration
    description: Question management protected by an admin access JWT.
paths:
  /api/v1/questions:
    get:
      tags: [Quiz]
      operationId: listQuestions
      summary: List of questions
      responses:
        "200":
          description: Questions without correct answers. New installations start with 40 sample questions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicQuestion"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Administration]
      operationId: createQuestion
      summary: Create a question
      description: >-
        Use an admin bearer token, or an access JWT cookie with its X-CSRF-Token
        header and an Origin explicitly allowed for browser administration.
      security:
        - adminBearer: []
        - adminCookie: []
          adminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
            example:
              text: Which currency is used in Japan?
              options: [USD, EUR, JPY, GBP]
              correctAnswer: JPY
      responses:
        "201":
          description: Created question, including its correct answer for the admin.
          headers:
            Location:
              description: URL of the public question resource.
              schema:
                type: string
                example: /api/v1/questions/c72b3aab-633f-4268-88e7-c6ba1c3bb217
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/questions/{id}:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    get:
      tags: [Quiz]
      operationId: getQuestion
      summary: Get a specific question
      responses:
        "200":
          description: Question without its correct answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Administration]
      operationId: updateQuestion
      summary: Update part of a question
      description: >-
        Supply at least one field. Omitted or null fields retain their previous values.
        The merged question must be valid; changing options may require changing
        correctAnswer in the same request. Use an admin bearer token, or a browser
        access JWT cookie with its X-CSRF-Token header and an Origin explicitly allowed
        for browser administration.
      security:
        - adminBearer: []
        - adminCookie: []
          adminCsrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuestionRequest"
            example:
              text: What is the currency of Japan?
      responses:
        "200":
          description: Updated question, including its correct answer for the admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminQuestion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Administration]
      operationId: deleteQuestion
      summary: Delete a question
      description: >-
        Use an admin bearer token, or an access JWT cookie with its X-CSRF-Token
        header and an Origin explicitly allowed for browser administration.
      security:
        - adminBearer: []
        - adminCookie: []
          adminCsrf: []
      responses:
        "204":
          description: Question deleted. No response body.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/questions/{id}/answers:
    parameters:
      - $ref: "#/components/parameters/QuestionId"
    post:
      tags: [Quiz]
      operationId: submitAnswer
      summary: Check an answer
      description: >-
        Trims surrounding whitespace and ignores case when comparing answers.
        A valid but incorrect answer also returns 200 OK.
        Limited to 30 submissions per minute per client IP across all questions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnswerRequest"
            example:
              answer: JPY
      responses:
        "200":
          description: Whether the answer is correct. Does not reveal the correct answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Obtain an admin access token
      description: >-
        Checks the configured admin username and password. Limited to 5 requests
        per minute per client IP, shared with browser sign-in. This endpoint
        returns a bearer token for scripts and other non-browser clients; it does not
        create a browser cookie. Browser applications should use POST /api/v1/auth/session
        instead. Use HTTPS outside local development.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed admin access token with a configurable expiration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session:
    post:
      tags: [Authentication]
      operationId: createBrowserSession
      summary: Sign in with HttpOnly JWT cookies
      description: >-
        Checks the configured admin username and password against its salted bcrypt
        hash, then sets signed access and refresh JWTs in HttpOnly cookies. Requires JSON
        and an Origin in ADMIN_CORS_ALLOWED_ORIGINS, which never accepts a wildcard.
        Limited to 5 sign-in requests per minute per client IP, shared with
        POST /api/v1/auth/login. The response contains authentication metadata and a CSRF
        token, never the cookie value or a bearer token. Use credentials: include for
        browser requests and keep the CSRF token in memory. No backend session record
        is created. Responses use Cache-Control: no-store. Use HTTPS outside local development.
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT cookies issued; authentication credentials are not readable by JavaScript.
          headers:
            Set-Cookie:
              description: >-
                Sets the host-only currency_quiz_admin cookie with Path=/api/v1,
                HttpOnly, and the configured Secure and SameSite attributes.
                Sets currency_quiz_admin_refresh on /api/v1/auth/session as well.
                Secure and SameSite=Strict are the defaults; SameSite=None requires Secure.
                Access defaults to 300 seconds and refresh to 600 seconds from login,
                configured through JWT_TOKEN_TTL_SECONDS and JWT_REFRESH_TOKEN_TTL_SECONDS.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Authentication]
      operationId: getBrowserSession
      summary: Read current browser authentication metadata
      description: >-
        Returns the authenticated username, remaining token lifetimes, and JWT-bound
        CSRF token without issuing tokens or extending expiry. Uses Cache-Control: no-store.
        Explicit origins must be allowed for browser administration. A same-origin
        browser GET may omit Origin. Cross-origin browser requests need credentials:
        include and credentialed CORS for their exact origin. A bearer token is not
        accepted in place of a JWT cookie. A valid refresh JWT can restore metadata
        after access expires, but cannot authorize question changes.
      security:
        - adminCookie: []
        - adminRefresh: []
      responses:
        "200":
          description: Current token metadata; no authentication credential is exposed in JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Authentication]
      operationId: deleteBrowserSession
      summary: Clear browser authentication cookies
      description: >-
        Expires both cookies using their original paths and attributes. Requires
        the JWT-bound X-CSRF-Token and an Origin allowed for browser administration.
        Uses Cache-Control: no-store. There is no server-side revocation registry:
        copied access and refresh JWTs remain valid until their respective expiry.
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
      security:
        - adminCookie: []
          adminCsrf: []
        - adminRefresh: []
          adminCsrf: []
      responses:
        "204":
          description: Browser authentication cookies cleared. No response body.
          headers:
            Set-Cookie:
              description: Expires both JWT cookies with the same paths and attributes used at sign-in.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session/refresh:
    post:
      tags: [Authentication]
      operationId: refreshBrowserSession
      summary: Renew the browser access JWT
      description: >-
        Requires an unexpired refresh JWT cookie, its CSRF token, and a trusted Origin.
        Issues a new access JWT; the refresh JWT and its original expiry do not change.
        Refresh defaults to a fixed 600-second window from login, after which credentials
        must be entered again. Earlier JWTs remain valid until expiry; refresh reuse
        cannot be detected without server-side state. Limited to 30 requests per minute per client IP.
        Responses, including errors, use Cache-Control: no-store.
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
      security:
        - adminRefresh: []
          adminCsrf: []
      responses:
        "200":
          description: Updated token metadata and a new access Set-Cookie header.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Admin JWT returned by POST /api/v1/auth/login.
    adminCookie:
      type: apiKey
      in: cookie
      name: currency_quiz_admin
      description: >-
        Signed access JWT in an HttpOnly cookie set by POST /api/v1/auth/session.
        Browser requests use credentials: include; JavaScript never reads its value.
        The backend verifies the signature and claims without a session registry.
        Default lifetime is 300 seconds, configurable through JWT_TOKEN_TTL_SECONDS.
        Mutations require the JWT-bound CSRF header and an explicitly trusted Origin.
    adminCsrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        JWT-bound token returned by POST or GET /api/v1/auth/session. Required
        with cookie authentication for mutations. Keep it in memory and retrieve it
        again after a page reload. It is not an authentication credential by itself.
    adminRefresh:
      type: apiKey
      in: cookie
      name: currency_quiz_admin_refresh
      description: >-
        Signed refresh JWT in an HttpOnly cookie, scoped to /api/v1/auth/session.
        Expires 600 seconds after login by default, configurable through
        JWT_REFRESH_TOKEN_TTL_SECONDS. Refresh does not extend that deadline.
        Never exposed in JSON and never accepted as an access token. There is no
        single-use enforcement or reuse detection. Refresh and logout require CSRF.
  parameters:
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      description: Exact browser origin listed in ADMIN_CORS_ALLOWED_ORIGINS; wildcard and null origins are rejected.
      schema:
        type: string
        format: uri
        example: https://quiz.example.com
    QuestionId:
      name: id
      in: path
      required: true
      description: Question UUID. A malformed UUID produces 400; an unknown UUID produces 404.
      schema:
        type: string
        format: uuid
  responses:
    Forbidden:
      description: The request origin is not allowed, or a cookie-authenticated mutation has a missing or invalid CSRF token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    BadRequest:
      description: Invalid JSON, fields, question ID, or merged question.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Invalid credentials or a missing, expired, or invalid admin JWT.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Question or route does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnsupportedMediaType:
      description: Request Content-Type must be application/json.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Per-client-IP rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: Unexpected server error. Internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    PublicQuestion:
      type: object
      additionalProperties: false
      required: [id, text, options]
      description: Public question data. Correct answers are never included.
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
        options:
          $ref: "#/components/schemas/Options"
    AdminQuestion:
      type: object
      additionalProperties: false
      required: [id, text, options, correctAnswer]
      description: Question returned only by authenticated administration operations.
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 500
        options:
          $ref: "#/components/schemas/Options"
        correctAnswer:
          $ref: "#/components/schemas/CorrectAnswer"
    Options:
      type: array
      minItems: 2
      maxItems: 10
      uniqueItems: true
      description: Stored options are trimmed and unique when compared without case.
      items:
        type: string
        minLength: 1
        maxLength: 200
    CorrectAnswer:
      type: string
      minLength: 1
      maxLength: 200
      description: Stored correct answer. Matches one of the stored options.
    CreateQuestionRequest:
      type: object
      additionalProperties: false
      required: [text, options, correctAnswer]
      properties:
        text:
          type: string
          minLength: 1
          description: After trimming, must contain 1 to 500 UTF-16 code units.
        options:
          type: array
          minItems: 2
          maxItems: 10
          uniqueItems: true
          description: Must also be unique after trimming and comparing without case.
          items:
            type: string
            minLength: 1
            description: After trimming, must contain 1 to 200 UTF-16 code units.
        correctAnswer:
          type: string
          minLength: 1
          description: After trimming, must contain 1 to 200 UTF-16 code units and match an option without case.
    UpdateQuestionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: At least one field must have a non-null value; the resulting question must be valid.
      not:
        type: object
        properties:
          text:
            type: string
            nullable: true
            enum: [null]
          options:
            type: array
            nullable: true
            enum: [null]
            items:
              type: string
          correctAnswer:
            type: string
            nullable: true
            enum: [null]
      properties:
        text:
          type: string
          nullable: true
          minLength: 1
          description: Null retains the existing value. Otherwise, trim and require 1 to 500 UTF-16 code units.
        options:
          type: array
          nullable: true
          minItems: 2
          maxItems: 10
          uniqueItems: true
          description: Null retains the existing options. Otherwise, options must be unique after trimming and comparing without case.
          items:
            type: string
            minLength: 1
            description: After trimming, must contain 1 to 200 UTF-16 code units.
        correctAnswer:
          type: string
          nullable: true
          minLength: 1
          description: Null retains the existing value. Otherwise, trim and require 1 to 200 UTF-16 code units matching a resulting option without case.
    AnswerRequest:
      type: object
      additionalProperties: false
      required: [answer]
      properties:
        answer:
          type: string
          minLength: 1
          description: After trimming, must contain 1 to 200 UTF-16 code units. Does not have to match a listed option.
    AnswerResponse:
      type: object
      additionalProperties: false
      required: [correct]
      properties:
        correct:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 1024
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          description: Token lifetime in seconds.
          example: 300
    BrowserSessionResponse:
      type: object
      additionalProperties: false
      required: [username, expiresIn, accessExpiresIn, csrfToken]
      description: >-
        Browser authentication metadata, without an authentication cookie or a bearer
        token. The CSRF token alone cannot authenticate a request.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        expiresIn:
          type: integer
          format: int64
          minimum: 1
          description: Remaining refresh lifetime in seconds, or access lifetime when only access is available. Reads and refresh never extend the refresh deadline.
          example: 600
        accessExpiresIn:
          type: integer
          format: int64
          minimum: 0
          description: Remaining access-cookie lifetime; zero means refresh is required before admin changes.
          example: 300
        csrfToken:
          type: string
          minLength: 43
          maxLength: 43
          pattern: "^[A-Za-z0-9_-]{43}$"
          description: Random nonce bound to signed JWT claims, encoded as unpadded base64url. Keep it in memory.
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          example: validation_error
        message:
          type: string
          example: Request validation failed
        details:
          type: array
          description: Validation reasons; an empty array when no additional details are available.
          items:
            type: string
